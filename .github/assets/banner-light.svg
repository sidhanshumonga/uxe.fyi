<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="uxe.fyi — We engineer the feel of software so it feels inevitable.">
  <title>uxe.fyi — We engineer the feel of software so it feels inevitable.</title>
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.55">
      <stop offset="0" stop-color="#FF3D88" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#FF3D88" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1280" height="560" rx="22"/></clipPath>
    <style>
      .w { opacity: 0; animation: word 12s infinite; }
      .w0 { animation-delay: 0.0s; }
      .w1 { animation-delay: 2.4s; }
      .w2 { animation-delay: 4.8s; }
      .w3 { animation-delay: 7.2s; }
      .w4 { animation-delay: 9.6s; }
      @keyframes word {
        0% { opacity: 0; transform: translateY(14px); }
        2.92% { opacity: 1; transform: translateY(0); }
        17.08% { opacity: 1; transform: translateY(0); }
        20.00% { opacity: 0; transform: translateY(-14px); }
        100% { opacity: 0; }
      }
      .caret { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .cursor { animation: glide 7.2s cubic-bezier(0.65, 0, 0.35, 1) infinite; }
      @keyframes glide {
        0%, 22%   { transform: translate(0px, 0px); }
        33%, 55%  { transform: translate(-150px, 70px); }
        66%, 88%  { transform: translate(-40px, 150px); }
        100%      { transform: translate(0px, 0px); }
      }
      .lbl { opacity: 0; animation: lbl 7.2s infinite; }
      .l0 { animation-delay: 0s; } .l1 { animation-delay: 2.4s; } .l2 { animation-delay: 4.8s; }
      @keyframes lbl { 0% { opacity: 0; } 4%, 26% { opacity: 1; } 31%, 100% { opacity: 0; } }
      .ticker { transform-box: fill-box; animation: scroll 60s linear infinite; }
      @keyframes scroll { to { transform: translateX(-50%); } }
      @media (prefers-reduced-motion: reduce) {
        .w, .cursor, .lbl, .ticker, .caret { animation: none; }
        .w0, .l0 { opacity: 1; }
      }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1280" height="560" fill="#F4F1EA"/>
    <rect width="1280" height="560" fill="url(#glow)"/>
    <rect width="1280" height="560" filter="url(#grain)" opacity="0.05"/>

    <!-- top bar -->
    <text x="72" y="78" font-family="'Bricolage Grotesque', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.5" fill="#16140F">uxe.fyi</text>
    <rect class="caret" x="161" y="58" width="10" height="26" rx="1.5" fill="#FF3D88"/>
    <text x="1208" y="76" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" fill="#6F6C61"><tspan fill="#FF3D88">●</tspan>  open source · built in public</text>
    <line x1="72" y1="110" x2="1208" y2="110" stroke="rgba(11,11,10,0.12)"/>

    <!-- eyebrow -->
    <text x="72" y="168" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#6F6C61">an open notebook on the discipline of UX engineering</text>

    <!-- headline -->
    <text x="68" y="252" font-family="'Bricolage Grotesque', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="500" letter-spacing="-3" fill="#16140F">We engineer the <tspan font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-weight="400" letter-spacing="-1" fill="#FF3D88">feel</tspan></text>
    <text x="68" y="338" font-family="'Bricolage Grotesque', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="80" font-weight="500" letter-spacing="-3" fill="#16140F">of software so it feels</text>
    <text class="w w0" x="70" y="424" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-size="84" fill="#16140F">inevitable<tspan fill="#FF3D88">.</tspan></text>
    <text class="w w1" x="70" y="424" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-size="84" fill="#16140F">effortless<tspan fill="#FF3D88">.</tspan></text>
    <text class="w w2" x="70" y="424" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-size="84" fill="#16140F">intuitive<tspan fill="#FF3D88">.</tspan></text>
    <text class="w w3" x="70" y="424" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-size="84" fill="#16140F">human<tspan fill="#FF3D88">.</tspan></text>
    <text class="w w4" x="70" y="424" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" font-size="84" fill="#16140F">trustworthy<tspan fill="#FF3D88">.</tspan></text>

    <!-- cursor demo -->
    <g transform="translate(1100 215)">
      <g class="cursor">
        <path d="M0 0 L0 30 L8 22.5 L13.5 35 L18.5 32.8 L13 20.5 L24 20.5 Z" fill="#16140F" stroke="#F4F1EA" stroke-width="1.6" stroke-linejoin="round"/>
        <g class="lbl l0"><rect x="22" y="36" width="198.4" height="28" rx="14" fill="#FF3D88"/><text x="33" y="55" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#0B0B0A">200ms · feels instant</text></g>
        <g class="lbl l1"><rect x="22" y="36" width="232" height="28" rx="14" fill="#FF3D88"/><text x="33" y="55" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#0B0B0A">enter &amp; exit symmetry</text></g>
        <g class="lbl l2"><rect x="22" y="36" width="232" height="28" rx="14" fill="#FF3D88"/><text x="33" y="55" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#0B0B0A">focus ring · never hidden</text></g>
      </g>
    </g>

    <!-- ticker -->
    <rect x="0" y="490" width="1280" height="70" fill="#ECE8DE"/>
    <line x1="0" y1="490" x2="1280" y2="490" stroke="rgba(11,11,10,0.12)"/>
    <g class="ticker">
      <text x="0" y="531" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" fill="#46443D" xml:space="preserve">invisible friction   •   optimistic UI   •   calm interfaces   •   perceived performance   •   interface trust   •   fitts’s law   •   design systems   •   motion choreography   •   cognitive load   •   emotional latency   •   micro-copy   •   a11y as experience   •   state machines   •   easing curves   •   progressive disclosure   •   invisible friction   •   optimistic UI   •   calm interfaces   •   perceived performance   •   interface trust   •   fitts’s law   •   design systems   •   motion choreography   •   cognitive load   •   emotional latency   •   micro-copy   •   a11y as experience   •   state machines   •   easing curves   •   progressive disclosure   •   </text>
    </g>
  </g>
</svg>
